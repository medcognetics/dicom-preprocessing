[package]
name = "dicom-preprocessing" # the name of the package
version = "0.2.0"    # the current version, obeying semver
authors = ["Scott Chase Waggener <chase.waggener@icloud.com>"]
edition = "2021"
rust-version = "1.89.0"

[lib]
name = "dicom_preprocessing"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
tempfile = "=3.27.0"
dicom = { version = "0.10.0", features = ["image", "ndarray"]}
dicom-pixeldata = { version = "0.10.0", features = ["openjpeg-sys", "rayon"]}
indicatif = { version= "0.18.4", features= ["rayon"] }
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12"
rust_search = "2.1"
log = "0.4"
thiserror = "2.0"
env_logger = "0.11"
image = "0.25"
tiff = "0.11"
half = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.9.1"
tracing = "0.1"
tracing-subscriber = "0.3"
num = "0.4"
ndarray = "0.17"
itertools = "0.15"
imageproc = "0.27"
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }
arrow = "59.0"
parquet = "59.0"
csv = "1.4"

[target.'cfg(windows)'.dependencies]
file-id = "=0.2.3"

[features]
python = ["pyo3", "numpy", "pyo3/auto-initialize"]

[dev-dependencies]
dicom-test-files = "0.4"
rstest = "0.26"
rand = "0.10"
criterion = "0.8"

[workspace]
members = [".", "bindings/node"]
resolver = "2"

[patch.crates-io]
# Temporary decoder patches (#128). Switch back to crates.io once upstream releases include them.
# Restart-boundary lossless JPEG fix (image-rs/jpeg-decoder#287) plus 12-bit single-component DCT decoding.
jpeg-decoder = { git = "https://github.com/medcognetics/jpeg-decoder.git", branch = "dicom-12bit-extended" }
# dicom-rs v0.10.0 with the RLE Lossless sample byte position fix. Patch every dicom-rs crate
# so that the encoding traits and transfer syntax registry stay a single crate instance.
dicom = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-core = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-dictionary-std = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-dump = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-encoding = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-json = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-object = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-parser = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-pixeldata = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-transfer-syntax-registry = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }
dicom-ul = { git = "https://github.com/medcognetics/dicom-rs.git", branch = "fix/rle-sample-offset-v0.10" }

[profile.release]
codegen-units = 1
lto = "fat"

[[bin]]
name = "dicom-preprocess"
path = "src/main.rs"

[[bin]]
name = "dicom-manifest"
path = "src/bin/manifest.rs"

[[bin]]
name = "dicom-voilut"
path = "src/voilut/main.rs"

[[bin]]
name = "dicom-validate"
path = "src/bin/validate.rs"

[[bin]]
name = "dicom-traces"
path = "src/bin/trace.rs"

[[bin]]
name = "tiff-combine"
path = "src/bin/combine.rs"

[[bin]]
name = "tiff-stats"
path = "src/bin/tiff_stats.rs"

[[bench]]
name = "inode_sort"
harness = false

[[bench]]
name = "dicom_file"
harness = false

[[bench]]
name = "dbt_parallel"
harness = false

[[bench]]
name = "crop"
harness = false

[[bench]]
name = "pad"
harness = false

[[bench]]
name = "batch_preprocess"
harness = false

[[bench]]
name = "image_array"
harness = false
